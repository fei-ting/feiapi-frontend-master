server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip 压缩，提升传输效率
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # HTML 入口文件不强缓存，确保部署后能及时获取最新资源引用。
    location = /index.html {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # 历史 PWA/React 遗留路径不参与 SPA 回退，避免浏览器误用旧缓存。
    location ~* ^/(service-worker\.js|precache-manifest.*\.js|asset-manifest\.json|manifest\.json)$ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-store" always;
        return 404;
    }

    # 带内容 hash 的静态资源可以长期缓存，文件内容变化后构建产物文件名会变化。
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 文档聚合保存由后端按实际读取字节执行 1 MiB 专用限制，并统一返回 JSON 413 契约。
    location = /api/interfaceDoc/save {
        include /etc/nginx/conf.d/security-headers.inc;
        client_max_body_size 1m;
        error_page 413 = @interface_doc_request_too_large;
        proxy_pass http://feiapi-backend:9527;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 超过代理快速失败阈值时保持与后端一致的 413 JSON 响应。
    location @interface_doc_request_too_large {
        include /etc/nginx/conf.d/security-headers.inc;
        default_type application/json;
        return 413 '{"code":41300,"data":null,"message":"接口文档保存请求体不能超过 1048576 字节"}';
    }

    # API 代理：转发请求到后端服务
    location /api/ {
        include /etc/nginx/conf.d/security-headers.inc;
        proxy_pass http://feiapi-backend:9527/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 路由回退：所有非文件请求都返回 index.html
    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        try_files $uri $uri/ /index.html;
    }
}
